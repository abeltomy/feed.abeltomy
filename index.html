<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>feed.abeltomy.com</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">feed.abeltomy.com</a>
    <div class="nav-right">
      <a href="/admin.html" class="nav-link">Admin</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </nav>

  <div class="toolbar">
    <select id="year-filter" class="year-select">
      <option value="all">All years</option>
    </select>
  </div>

  <div id="timeline"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <div class="lightbox-content" id="lightbox-content"></div>
  </div>

  <script>
    (function () {
      if (localStorage.getItem('theme') === 'night') {
        document.body.classList.add('night');
        document.getElementById('theme-toggle').textContent = '☀️';
      }
    })();
  </script>
  <script src="js/timeline.js?v=7"></script>
  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      const night = document.body.classList.toggle('night');
      this.textContent = night ? '☀️' : '🌙';
      localStorage.setItem('theme', night ? 'night' : 'light');
    });
  </script>
</body>
</html>
